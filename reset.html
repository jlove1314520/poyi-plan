<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>破億計畫 — 強制更新</title>
<style>
body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#FAF9F5;color:#1F1E1B;
display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;padding:24px}
.sp{width:36px;height:36px;border:4px solid #E7E4DA;border-top-color:#D97757;border-radius:50%;
margin:0 auto 16px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="sp"></div><div id="msg">正在清除快取、更新到最新版…<br>（你的紀錄資料不會受影響）</div></div>
<script>
(async()=>{
  try{const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister();}catch(e){}
  try{const ks=await caches.keys();for(const k of ks)await caches.delete(k);}catch(e){}
  try{await fetch("./index.html",{cache:"reload"});}catch(e){}
  try{await fetch("./sw.js",{cache:"reload"});}catch(e){}
  document.getElementById("msg").innerHTML="更新完成，正在開啟 App…";
  setTimeout(()=>location.replace("./"),600);
})();
</script>
</body>
</html>
